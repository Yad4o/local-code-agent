title = "Shopping Cart Engine"
test_command = "python -m pytest -q"

[[step]]
title = "add_item adds item with default quantity"
description = """
Create add_item(cart, name, price, quantity=1) in cart/engine.py (package: cart).
cart is a list of dicts {"name", "price", "quantity"}. Return a NEW list; do not change the input.
If an item with the same name is already in the cart, add quantity to it; otherwise append a new item.
Raise ValueError if price < 0 or quantity <= 0.
"""
commit = "feat: add cart add_item"
tests = ["tests/test_add.py"]                 # generated from the examples below, never by the model
files = ["cart/__init__.py", "cart/engine.py"]
function = "cart.engine:add_item"             # package.module:name, the module file must be in `files`
signature = "add_item(cart, name, price, quantity=1)"   # the harness writes the def line + __init__.py; the model writes only the body

[[step.examples]]
args = [[], "apple", 1.5]
expect = [{ name = "apple", price = 1.5, quantity = 1 }]

[[step.examples]]
args = [[{ name = "apple", price = 1.5, quantity = 1 }], "apple", 1.5, 2]
expect = [{ name = "apple", price = 1.5, quantity = 3 }]

[[step.examples]]
args = [[{ name = "apple", price = 1.5, quantity = 1 }], "pear", 2.0]
expect = [{ name = "apple", price = 1.5, quantity = 1 }, { name = "pear", price = 2.0, quantity = 1 }]

[[step.examples]]
args = [[], "apple", -1.0]
raises = "ValueError"

[[step.examples]]
args = [[], "apple", 1.5]
kwargs = { quantity = 0 }
raises = "ValueError"
