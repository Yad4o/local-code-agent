# codeagent plan. EVERY plan has this same structure.
#
# Tips for a small local model:
#  * keep each [[step]] SMALL: one function or one small module
#  * put exact examples (input -> output) in the description
#  * name the exact module/function names the tests must import
#  * list EVERY file the step may create or edit: the agent can touch nothing else

title = "Slugify utility"                  # required
test_command = "python -m pytest -q"        # required; first word must be in allowed_commands
# workspace = "~/projects/slugify"          # optional; `--workspace` on the CLI overrides it

[[step]]
title = "slugify lowercases and joins words with dashes"     # required, unique
description = """
Create function slugify(text: str) -> str in slugify/core.py (package: slugify).
Lowercase the text, replace each run of non-alphanumeric characters with a
single "-", and strip leading/trailing "-".
Examples: "Hello, World!" -> "hello-world"; "  A  B " -> "a-b"; "" -> "".
Tests must import it with: from slugify.core import slugify
"""                                                           # required
commit = "feat: add slugify core function"                   # required, one line, <= 72 chars
tests = ["tests/test_core.py"]                               # required: written FIRST (TDD)
files = ["slugify/__init__.py", "slugify/core.py"]           # required: implementation files
# context = ["README.md"]                                    # optional: existing files to show the model

# BEST for a small model: let YOU decide what is correct instead of the model. Add `function` and
# `[[step.examples]]`; the agent then prints the test file from them (the model never writes tests)
# and the model only writes the implementation. `tests` must then list exactly one file.
#
# function = "slugify.core:slugify"           # package.module:name; slugify/core.py must be in `files`
# [[step.examples]]
# args = ["Hello, World!"]
# expect = "hello-world"
# [[step.examples]]
# args = [123]
# raises = "TypeError"                        # a builtin exception name; use `kwargs = { x = 1 }` for keyword args
#
# FASTEST for a small model: also give the exact `signature`. The agent then writes the def line and the
# package __init__.py itself and the model only writes the function BODY (a few lines, no loops).
# `files` may then only be the module file and its package __init__.py files.
# signature = "slugify(text)"
