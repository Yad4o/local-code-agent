[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "codeagent"
version = "0.1.0"
description = "Offline, resource-safe coding agent that executes structured plans with a small local LLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []            # stdlib only: nothing to download, works offline

[project.optional-dependencies]
dev = ["pytest", "pytest-xdist", "ruff"]
tools = ["ruff"]                 # optional: unused-import removal and undefined-name checks

[project.scripts]
codeagent = "agent:entry"

[tool.setuptools]
py-modules = ["agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
